name: alexandria

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: alexandria
      POSTGRES_PASSWORD: alexandria
      POSTGRES_DB: alexandria
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U alexandria -d alexandria']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: alexandria
      MINIO_ROOT_PASSWORD: alexandria-secret
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # Web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot job: creates the documents bucket, then exits.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 alexandria alexandria-secret &&
      mc mb --ignore-existing local/alexandria-documents &&
      echo 'bucket ready'
      "

  # Heavy image + model downloads, so behind a profile:
  #   docker compose --profile llm up -d
  # Then pull models once:
  #   docker compose exec ollama ollama pull llama3.1:8b
  #   docker compose exec ollama ollama pull nomic-embed-text
  ollama:
    image: ollama/ollama:latest
    profiles: ['llm']
    ports:
      - '11434:11434'
    volumes:
      - ollamadata:/root/.ollama

volumes:
  pgdata:
  redisdata:
  miniodata:
  ollamadata:
